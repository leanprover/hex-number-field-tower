name = "hexnumberfieldtower-conformance"
defaultTargets = ["HexNumberFieldTowerConformance", "hexnumberfieldtower_emit_fixtures"]

leanOptions = [
  { name = "doc.verso", value = true },
  { name = "doc.verso.suggestions", value = false },
]

[[require]]
name = "HexNumberFieldTower"
path = ".."

[[require]]
name = "hex-test-kit"
git = "https://github.com/leanprover/hex-test-kit.git"
rev = "5b3dc5d7789cb680d64f8f4046254f93b7424e4f"

[[lean_lib]]
name = "HexNumberFieldTowerConformance"
globs = ["HexNumberFieldTower.Conformance"]

[[lean_exe]]
name = "hexnumberfieldtower_emit_fixtures"
root = "HexNumberFieldTower.EmitFixtures"
