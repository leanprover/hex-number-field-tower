name = "hex-number-field-tower"
defaultTargets = ["HexNumberFieldTower"]

leanOptions = [
  { name = "doc.verso", value = true },
  { name = "doc.verso.suggestions", value = false },
]

[[require]]
name = "HexNumberField"
git = "https://github.com/leanprover/hex-number-field.git"
rev = "v0.6.0"

[[require]]
name = "HexResultant"
git = "https://github.com/leanprover/hex-resultant.git"
rev = "v0.6.0"

[[require]]
name = "HexBerlekampZassenhaus"
git = "https://github.com/leanprover/hex-berlekamp-zassenhaus.git"
rev = "v0.6.0"

[[lean_lib]]
name = "HexNumberFieldTower"

[[lean_lib]]
name = "HexNumberFieldTowerTests"
globs = ["HexNumberFieldTower.Embed"]
